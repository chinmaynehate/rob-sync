<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-1 Orchestra</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
     <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .joystick-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .joystick-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            position: relative;
        }
        .joystick-row button {
            width: 70px;
            height: 70px;
            font-size: 16px;
            border-radius: 30%;
            border: 2px solid transparent;
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out, border-color 0.1s ease-in-out;
        }
        .highlighted {
            border-color: #000000 !important;
        }
        .joystick-left { margin-right: 40px; }
        .joystick-right { margin-left: 40px; }
        .joystick-center .btn {
            width: 70px;
            height: 70px;
            font-size: 16px;
            border-radius: 50%;
            z-index: 1;
            margin-top: 1px;
        }
        
    </style>
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="text-center mb-4">Go-1 Orchestra (Local Network)</h1>
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        Connected Clients
                    </div>
                    <div class="card-body p-0">
                        <table id="clients-table" class="table table-hover mb-0 text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>Client ID</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="clients"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="joystick-container mt-4">
            <div class="joystick-row">
                <button class="btn btn-success" onclick="executeCommand('forward', this)">↑</button>
            </div>
            <div class="joystick-row">
                <button class="btn btn-info joystick-left" onclick="executeCommand('left', this)">←</button>
                <div class="joystick-center">
                    <button class="btn btn-danger" onclick="executeCommand('stop', this)">■</button>
                </div>
                <button class="btn btn-info joystick-right" onclick="executeCommand('right', this)">→</button>
            </div>
            <div class="joystick-row">
                <button class="btn btn-warning" onclick="executeCommand('backward', this)">↓</button>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-auto">
                <button class="btn btn-secondary m-2" onclick="executeCommand('dance 1', this)">Dance 1</button>
                <button class="btn btn-secondary m-2" onclick="executeCommand('dance 2', this)">Dance 2</button>
                <button class="btn btn-primary m-2" onclick="executeCommand('triangle', this)">Triangle</button>
            </div>
        </div>
    </div>

    <script>
        // Get the server's WebSocket URL dynamically
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsBaseUrl = `${wsProtocol}//${window.location.host}`;

        function generateClientId() {
            var userAgent = navigator.userAgent.toLowerCase();
            var deviceType = /mobile|tablet|ipad|iphone/.test(userAgent) ? 'Mobile' : 'Desktop';
            var platform = navigator.platform.toLowerCase();
            var os = userAgent.includes('android') ? 'Android' : 
                     platform.includes('win') ? 'Windows' : 
                     platform.includes('mac') ? 'Mac' : 
                     platform.includes('linux') ? 'Linux' : 'Other';
            var browser = userAgent.includes('chrome') ? 'Chrome' :
                          userAgent.includes('firefox') ? 'Firefox' :
                          userAgent.includes('safari') ? 'Safari' : 'Other';
            var uuid = 'xxxx-xxxx-4xxx-yxxx-xxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            }).substring(0, 8);
            return `${deviceType}-${os}-${browser}-${uuid}`;
        }

        function executeCommand(commandType, button) {
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('highlighted'));
            button.classList.add('highlighted');
            fetch('/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: commandType })
            }).then(response => response.json())
              .catch(error => console.error('Error:', error));
        }

        window.onload = function() {
            fetch('/clients')
                .then(response => response.json())
                .then(data => updateClientList(data.clients));

            var uniqueClientId = generateClientId();
            var ws = new WebSocket(`${wsBaseUrl}/ws/${uniqueClientId}`);

            ws.onopen = () => console.log("Connected to WebSocket with ID:", uniqueClientId);
            ws.onerror = (error) => console.error("WebSocket Error: ", error);
            ws.onmessage = (event) => {
                console.log("Received from server: " + event.data);
                let message = JSON.parse(event.data);
                updateClient(message);
            };
        };

        function updateClient(message) {
            var clientsTbody = document.getElementById('clients');
            var clientId = message.client_id;
            var status = message.status;
            var clientRow = document.getElementById(clientId);

            if (status === 'connected') {
                if (!clientRow) {
                    clientRow = document.createElement('tr');
                    clientRow.id = clientId;
                    clientRow.innerHTML = `<td>${clientId}</td><td>${status}</td>`;
                    clientsTbody.appendChild(clientRow);
                }
            } else if (status === 'disconnected' && clientRow) {
                clientsTbody.removeChild(clientRow);
            }
        }

        function updateClientList(clients) {
            var clientsTbody = document.getElementById('clients');
            clientsTbody.innerHTML = '';
            clients.forEach(clientId => {
                var clientRow = document.createElement('tr');
                clientRow.id = clientId;
                clientRow.innerHTML = `<td>${clientId}</td><td>connected</td>`;
                clientsTbody.appendChild(clientRow);
            });
        }
    </script>
</body>
</html>
